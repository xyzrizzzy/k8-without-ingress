apiVersion: v1
kind: Namespace
metadata:
  name: frontend-space
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend-space
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image:  ayushshh/vite-k8:v3
          ports:
            - containerPort: 4173
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: frontend-space
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 4173
      targetPort: 4173
  type: ClusterIP